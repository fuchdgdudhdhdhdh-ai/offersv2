<div class="w"><header>◇ <span id="head">Оффер NFT</span></header><main><section class="n"><div class="pic">🎁</div><div class="meta"><b id="title">NFT</b><small>От: <strong id="sender">—</strong></small><div class="price"><span id="price">0</span> <i id="currency">💎</i></div></div></section><div id="status" class="status">⌛ Ожидание</div><section id="pending"><button class="yes" onclick="act('accept')">✓ Принять</button><button class="no" onclick="act('reject')">✕ Отклонить</button></section><section id="accepted" hidden><button class="yes" onclick="TelegramWidget.openTelegramLink('https://t.me/nft/'+d.slug)">↗ Открыть подарок</button><details><summary>Как передать NFT?</summary><p>1. Откройте подарок.<br>2. Выберите «Передать».<br>3. Подтвердите отправку получателю.</p></details></section><p id="result"></p></main></div>
<style>
*{box-sizing:border-box}body{margin:0;padding:0;background:transparent;color:var(--tg-theme-text-color,#f4f6fa);font:15px system-ui,sans-serif}.w{overflow:hidden;border-radius:22px;background:linear-gradient(145deg,#202633,#171b25);border:1px solid #ffffff18;box-shadow:0 12px 30px #0005}header{padding:15px 18px;background:linear-gradient(100deg,#1f8fe0,#4f6cf0 55%,#7a56e0);font-weight:700;font-size:17px}main{padding:17px}.n{display:flex;align-items:center;gap:14px;margin-bottom:15px}.pic{width:76px;height:76px;flex:none;border-radius:17px;display:grid;place-items:center;font-size:38px;background:linear-gradient(145deg,#3a8f5a,#1f5a3a);box-shadow:0 8px 20px #30d15835}.meta{min-width:0;flex:1}.meta b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{display:block;margin:4px 0 9px;color:#929bad}.meta strong{color:#2aabee}.price{display:inline-flex;gap:7px;align-items:center;padding:6px 11px;border-radius:20px;background:#0098ea20;border:1px solid #0098ea44;color:#39a9f4;font-weight:800;font-size:18px}.price i{font-style:normal}.status{text-align:center;padding:10px;margin:0 0 14px;border-radius:12px;background:#ffb34018;color:#ffbd58;font-weight:650}.status.ok{background:#30d15818;color:#30d158}.status.bad{background:#ff453a18;color:#ff6259}button{width:100%;padding:13px;border:0;border-radius:13px;font:700 15px system-ui;margin:4px 0;color:white}.yes{background:linear-gradient(100deg,#2196f3,#5b6cf5);box-shadow:0 7px 18px #3b82f655}.no{background:#17191f;border:1px solid #ffffff70;color:#ff6259}details{margin-top:10px;padding:12px;border-radius:12px;background:#ffffff0a;color:#c4cad5}summary{font-weight:650}details p{line-height:1.5}#result{text-align:center;color:#aab3c3;font-size:13px;margin:8px 0 0}[hidden]{display:none!important}
</style>
<script>
const W=TelegramWidget;let d={};try{d=JSON.parse(W.chatData||'{}')}catch(e){};const $=id=>document.getElementById(id);$('title').textContent=d.title||'NFT';$('sender').textContent=d.sender||'—';$('price').textContent=Number(d.price||0).toLocaleString('ru-RU');$('currency').textContent=d.currency==='stars'?'⭐':'💎';function draw(s){$('head').textContent=s==='pending'?'Оффер NFT':s==='accepted'?'Сделка по NFT':'Оффер NFT';$('status').className='status'+(s==='accepted'?' ok':s==='rejected'?' bad':'');$('status').textContent=s==='accepted'?'✓ Принято':s==='rejected'?'✕ Оффер отклонён':'⌛ Ожидание';$('pending').hidden=s!=='pending';$('accepted').hidden=s!=='accepted'}function act(a){$('result').textContent='Отправляем…';W.request(a==='accept'?'a':'r').then(x=>{$('result').textContent=x.result||'Готово'}).catch(e=>{$('result').textContent='Ошибка: '+e.code})}W.onEvent('chatDataChanged',()=>{try{d=JSON.parse(W.chatData||'{}');draw(d.status)}catch(e){}});draw(d.status||'pending');
</script>
